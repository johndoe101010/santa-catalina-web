name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto
        run: npm run build

      - name: Buscar carpeta correcta para GitHub Pages
        run: |
          rm -rf pages-dist

          echo "Buscando index.html generado por el build..."
          find . -name "index.html" -type f

          if [ -f "dist/index.html" ]; then
            echo "Usando dist/"
            cp -R dist pages-dist

          elif [ -f ".output/public/index.html" ]; then
            echo "Usando .output/public/"
            cp -R .output/public pages-dist

          elif [ -f "dist/client/index.html" ]; then
            echo "Usando dist/client/"
            cp -R dist/client pages-dist

          elif [ -f "build/client/index.html" ]; then
            echo "Usando build/client/"
            cp -R build/client pages-dist

          elif [ -f "build/index.html" ]; then
            echo "Usando build/"
            cp -R build pages-dist

          else
            echo "ERROR: No se encontró index.html en una carpeta válida."
            echo "Estructura generada:"
            find . -maxdepth 4 -type d
            exit 1
          fi

          cp pages-dist/index.html pages-dist/404.html

          echo "Contenido final que se subirá a GitHub Pages:"
          ls -la pages-dist

      - name: Subir archivos compilados
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
