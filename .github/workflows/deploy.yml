name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto
        run: npm run build

      - name: Preparar archivos para GitHub Pages
        shell: bash
        run: |
          rm -rf pages-dist

          echo "Buscando index.html generado por el build..."

          INDEX_FILE=$(find dist .output .vinxi build -name "index.html" -type f 2>/dev/null | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: No se encontró ningún index.html generado."
            echo "Archivos index.html encontrados en todo el proyecto:"
            find . -path "./node_modules" -prune -o -name "index.html" -type f -print
            exit 1
          fi

          SITE_DIR=$(dirname "$INDEX_FILE")

          echo "index.html encontrado en:"
          echo "$INDEX_FILE"

          echo "Carpeta que se publicará:"
          echo "$SITE_DIR"

          mkdir -p pages-dist
          cp -R "$SITE_DIR"/. pages-dist/

          cp pages-dist/index.html pages-dist/404.html

          echo "Contenido final de pages-dist:"
          ls -la pages-dist

      - name: Subir archivos compilados
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
