name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto
        run: npm run build

      - name: Preparar archivos para GitHub Pages
        run: |
          rm -rf pages-dist

          if [ -d "dist" ]; then
            cp -R dist pages-dist
          elif [ -d ".output/public" ]; then
            cp -R .output/public pages-dist
          elif [ -d "build/client" ]; then
            cp -R build/client pages-dist
          else
            echo "No se encontró carpeta de build: dist, .output/public o build/client"
            find . -maxdepth 3 -type d
            exit 1
          fi

          if [ -f "pages-dist/index.html" ]; then
            cp pages-dist/index.html pages-dist/404.html
          fi

      - name: Subir archivos compilados
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
